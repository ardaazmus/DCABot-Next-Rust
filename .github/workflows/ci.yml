# Faz 21 (P2-14): CI — "düzeltildi" ifadeleri beyan değil, kanıt olsun.
# Dış doğrulama raporu (DENETIM_RAPORU_FAZ20_DOGRULAMA.md §8) bu bosun
# ortamda derleme/test yapılamadığı için iddiaları "doğrulanamadı"
# etiketlemişti; bu iş her push'ta kapıları gerçekten çalıştırır.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  engine:
    name: Engine (cargo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-services/dca-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mini-services/dca-core
      - name: cargo test (workspace)
        run: cargo test --workspace --locked
      # Faz 21 (CI): clippy advisory — ~100 teknik uyarı temizliği borç olarak
      # raporlandı (Faz 21 tablosu); -D warnings hedefi sonraki faz. İşlevsel
      # kanıt (test) zorunlu kapı olarak kalır.
      - name: cargo clippy (advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets
  ui:
    name: UI (tsc + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Faz 22 (N-13): P0-9 geri-gelme tuzağına karşı negatif test — anahtarın
      # istemci kodunda env okuması ASLA dönmemeli (yalnız sunucu dosyaları).
      - name: guard — no NEXT_PUBLIC_ENGINE_API_KEY reads in client code
        run: |
          if grep -rn "process.env.NEXT_PUBLIC" src --include="*.ts" --include="*.tsx" | grep -v "NEXT_PUBLIC_ENGINE_PORT"; then
            echo "::error::NEXT_PUBLIC_* env okuması istemci kodunda — P0-9 regresyonu (yalnız NEXT_PUBLIC_ENGINE_PORT serbest)"
            exit 1
          fi
      - name: tsc --noEmit
        run: npx tsc --noEmit --incremental false
      - name: eslint
        run: npx eslint src --quiet
